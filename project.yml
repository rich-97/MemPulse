name: MemPulse
options:
  bundleIdPrefix: com.ricardomoreno
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  developmentLanguage: en

settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    ENABLE_HARDENED_RUNTIME: YES
    # No App Sandbox: the app runs /bin/ps to list processes.

targets:
  MemPulse:
    type: application
    platform: macOS
    sources:
      - path: MemPulse
    info:
      path: MemPulse/Info.plist
      properties:
        CFBundleName: MemPulse
        CFBundleDisplayName: MemPulse
        LSUIElement: true
        LSMinimumSystemVersion: "$(MACOSX_DEPLOYMENT_TARGET)"
        NSHumanReadableCopyright: ""
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ricardomoreno.MemPulse
        INFOPLIST_KEY_NSPrincipalClass: NSApplication

  MemPulseTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: MemPulseTests
    dependencies:
      - target: MemPulse
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ricardomoreno.MemPulseTests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  MemPulse:
    build:
      targets:
        MemPulse: all
        MemPulseTests: [test]
    test:
      targets:
        - MemPulseTests
    run:
      config: Debug
